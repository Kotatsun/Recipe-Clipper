<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f4ee">
    <meta name="description" content="RecipeClipper — local-first recipe archive">
    <script>
      try {
        const theme = localStorage.getItem("recipeclipper-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <title>RecipeClipper</title>
  </head>
  <body>
    <div class="app-shell">
      <div id="app" aria-live="polite"></div>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <noscript>RecipeClipperを使うにはJavaScriptを有効にしてください。</noscript>
    <script type="module" src="./app.js?v=6"></script>
  </body>
</html>
